
name: Auto Sync Fork

on:
  schedule:
    - cron: "*/15 * * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  sync:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout fork
        uses: actions/checkout@v4
        with:
          ref: master
          fetch-depth: 0

      - name: Sync with original
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git remote add upstream https://github.com/42-CodeChronicles/42-Minishell.git
          git fetch upstream master

          if ! git merge upstream/master --no-edit; then
            mapfile -t conflicts < <(git diff --name-only --diff-filter=U)

            if [[ ${#conflicts[@]} -ne 1 || "${conflicts[0]}" != ".github/workflows/sync.yml" ]]; then
              echo "Unexpected merge conflicts. Manual resolution required."
              exit 1
            fi

            git checkout --ours -- .github/workflows/sync.yml
            git add .github/workflows/sync.yml
            git commit -m "Sync upstream, keep fork workflow"
          fi

          git push origin master
